#-----------------------------------------------------------------------------
# lb-int - the INTERNAL LTM. One HAProxy hosting two pools:
#
#   :8081  -> middleware replica pool   (frontend calls this)
#   :8082  -> backend    replica pool   (middleware calls this)
#
# Everything here is plaintext HTTP on purpose: point the packet sniffer at
# middleware/backend and you can read full request/response bodies - a live
# demo of why "internal = trusted" is a dangerous assumption (zero-trust).
#-----------------------------------------------------------------------------
global
    log stdout format raw local0 info

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

#--- middleware pool ---------------------------------------------------------
frontend fe_mw
    bind *:8081
    default_backend middleware_pool

backend middleware_pool
    balance roundrobin
    option httpchk GET /healthz
    server-template mw 1-6 middleware:8000 check resolvers docker init-addr none

#--- backend pool ------------------------------------------------------------
frontend fe_be
    bind *:8082
    default_backend backend_pool

backend backend_pool
    balance roundrobin
    option httpchk GET /healthz
    server-template be 1-6 backend:8000 check resolvers docker init-addr none

#--- stats (:8404) -----------------------------------------------------------
frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    no log
