#-----------------------------------------------------------------------------
# lb-edge - the "LTM" (Local Traffic Manager) at the edge of the enterprise.
#
# This single HAProxy is your lab bench for HTTP vs HTTPS and TLS 1.2 vs 1.3:
#
#   :80    plain HTTP            -> sniff and read everything in cleartext
#   :443   HTTPS, TLS 1.3 ONLY   -> modern handshake (1-RTT, no RSA kx)
#   :8443  HTTPS, TLS 1.2 ONLY   -> classic handshake (compare in the sniffer)
#
# All three load-balance across the *frontend* replica pool using round-robin,
# discovering replicas dynamically through Docker's embedded DNS (127.0.0.11).
#-----------------------------------------------------------------------------
global
    log stdout format raw local0 info
    # Modern cipher suites; ssl-default-* documents policy, per-bind overrides win.
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor          # add X-Forwarded-For so apps see the real peer
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Docker's embedded DNS - lets server-template discover all replica IPs.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

#--- plain HTTP (:80) --------------------------------------------------------
frontend fe_http
    bind *:80
    http-request set-header X-Forwarded-Proto http
    default_backend frontend_pool

#--- HTTPS, TLS 1.3 only (:443) ---------------------------------------------
frontend fe_https_tls13
    bind *:443 ssl crt /certs/edge.pem ssl-min-ver TLSv1.3
    http-request set-header X-Forwarded-Proto https
    http-response set-header X-TLS-Version %[ssl_fc_protocol]
    default_backend frontend_pool

#--- HTTPS, TLS 1.2 only (:8443) --------------------------------------------
frontend fe_https_tls12
    bind *:8443 ssl crt /certs/edge.pem ssl-min-ver TLSv1.2 ssl-max-ver TLSv1.2
    http-request set-header X-Forwarded-Proto https
    http-response set-header X-TLS-Version %[ssl_fc_protocol]
    default_backend frontend_pool

#--- the pool of frontend replicas ------------------------------------------
backend frontend_pool
    balance roundrobin
    option httpchk GET /healthz
    # discover up to 6 replicas of the "frontend" service via Docker DNS
    server-template fe 1-6 frontend:8000 check resolvers docker init-addr none

#--- LTM stats dashboard (:8404) --------------------------------------------
frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    no log
